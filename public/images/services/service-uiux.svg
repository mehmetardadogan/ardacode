  <text x="65" y="118" fill="#E4E4E7" font-family="sans-serif" font-size="10"># Desktop Frame</text>
  <text x="75" y="136" fill="#A1A1AA" font-family="sans-serif" font-size="10">↳ Navigation</text>
  <text x="75" y="154" fill="#60A5FA" font-family="sans-serif" font-size="10">↳ Hero Component</text>
  <text x="75" y="172" fill="#A1A1AA" font-family="sans-serif" font-size="10">↳ CTA Button</text>
  <text x="65" y="200" fill="#E4E4E7" font-family="sans-serif" font-size="10"># Mobile Frame</text>
  <text x="65" y="228" fill="#E4E4E7" font-family="sans-serif" font-size="10"># Design Tokens</text>

  <!-- Canvas Artboard 1 (Mobile Wireframe) -->
  <rect x="180" y="90" width="125" height="220" rx="12" fill="#09090B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="180" y="84" fill="#3B82F6" font-family="sans-serif" font-size="9" font-weight="700">Mobile - 390px</text>
  <rect x="195" y="105" width="95" height="12" rx="4" fill="#27272A"/>
  <rect x="195" y="125" width="95" height="45" rx="6" fill="#1E293B"/>
  <rect x="195" y="180" width="45" height="15" rx="4" fill="#155DFC"/>
  <rect x="195" y="205" width="95" height="30" rx="4" fill="#27272A"/>
  <rect x="195" y="242" width="95" height="30" rx="4" fill="#27272A"/>

  <!-- Canvas Artboard 2 (Component Spec) -->
  <rect x="330" y="90" width="190" height="145" rx="10" fill="#09090B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="330" y="84" fill="#8B5CF6" font-family="sans-serif" font-size="9" font-weight="700">Design System - Buttons</text>
  <rect x="345" y="105" width="85" height="24" rx="6" fill="#155DFC"/>
  <text x="360" y="121" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">Primary Hover</text>
  <rect x="440" y="105" width="70" height="24" rx="6" fill="#27272A" stroke="#3F3F46"/>
  <text x="455" y="121" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="600">Secondary</text>

  <!-- Color Palette Swatches -->
  <rect x="345" y="145" width="22" height="22" rx="6" fill="#155DFC"/>
  <rect x="373" y="145" width="22" height="22" rx="6" fill="#6D28D9"/>
  <rect x="401" y="145" width="22" height="22" rx="6" fill="#10B981"/>
  <rect x="429" y="145" width="22" height="22" rx="6" fill="#080F20"/>
  <rect x="457" y="145" width="22" height="22" rx="6" fill="#DCE3EE"/>

  <text x="345" y="185" fill="#71717A" font-family="monospace" font-size="8">#155DFC  #6D28D9  #10B981</text>
  <rect x="345" y="195" width="160" height="25" rx="6" fill="#18181B" stroke="#27272A"/>
  <text x="355" y="211" fill="#E4E4E7" font-family="sans-serif" font-size="9">Border Radius: 16px</text>

  <!-- Designer Cursor Vector with Name Tag -->
  <g transform="translate(260, 160)">
    <path d="M 0 0 L 16 12 L 8 14 L 6 22 Z" fill="#155DFC" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="14" y="10" width="76" height="18" rx="4" fill="#155DFC"/>
    <text x="18" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800">Mehmet Arda</text>
  </g>
