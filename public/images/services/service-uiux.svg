  </defs>

  <rect width="600" height="380" rx="20" fill="url(#uiBg)"/>
  <circle cx="200" cy="100" r="180" fill="#6D28D9" fill-opacity="0.2" filter="blur(60px)"/>
  <circle cx="450" cy="280" r="160" fill="#155DFC" fill-opacity="0.18" filter="blur(50px)"/>

  <!-- Figma Canvas Window -->
  <rect x="50" y="35" width="500" height="305" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Toolbar Header -->
  <rect x="50" y="35" width="500" height="36" rx="14" fill="#27272A"/>
  <line x1="50" y1="71" x2="550" y2="71" stroke="#3F3F46"/>
  <circle cx="72" cy="53" r="5" fill="#EF4444"/>
  <circle cx="88" cy="53" r="5" fill="#F59E0B"/>
  <circle cx="104" cy="53" r="5" fill="#10B981"/>

  <!-- Tools -->
  <rect x="220" y="44" width="22" height="20" rx="4" fill="#3F3F46"/>
  <rect x="248" y="44" width="22" height="20" rx="4" fill="#155DFC"/>
  <rect x="276" y="44" width="22" height="20" rx="4" fill="#3F3F46"/>
  <rect x="304" y="44" width="22" height="20" rx="4" fill="#3F3F46"/>
  <rect x="332" y="44" width="22" height="20" rx="4" fill="#3F3F46"/>

  <!-- Left Layer Panel -->
  <rect x="50" y="71" width="110" height="269" fill="#18181B"/>
