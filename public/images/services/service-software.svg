<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="softBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="ideHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#softBg)"/>
  <circle cx="120" cy="100" r="180" fill="#155DFC" fill-opacity="0.18" filter="blur(60px)"/>
  <circle cx="480" cy="280" r="160" fill="#10B981" fill-opacity="0.12" filter="blur(50px)"/>

  <!-- Code Editor Window -->
  <rect x="50" y="40" width="500" height="295" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="50" y="40" width="500" height="38" rx="14" fill="url(#ideHeader)"/>
  <circle cx="72" cy="59" r="5" fill="#EF4444"/>
  <circle cx="88" cy="59" r="5" fill="#F59E0B"/>
  <circle cx="104" cy="59" r="5" fill="#10B981"/>

  <!-- Tab -->
  <rect x="130" y="48" width="130" height="26" rx="6" fill="#0F172A" stroke="#1E293B"/>
  <text x="145" y="65" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ApiController.php</text>

  <!-- Sidebar File Explorer -->
  <rect x="50" y="78" width="125" height="257" fill="#0A0F1D"/>
  <line x1="175" y1="78" x2="175" y2="335" stroke="#1E293B"/>
  
  <text x="68" y="105" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">EXPLORER</text>
  <text x="68" y="130" fill="#94A3B8" font-family="monospace" font-size="11">app/</text>
  <text x="78" y="150" fill="#94A3B8" font-family="monospace" font-size="11">Http/</text>
  <text x="88" y="170" fill="#60A5FA" font-family="monospace" font-size="11">Controllers/</text>
  <text x="78" y="195" fill="#94A3B8" font-family="monospace" font-size="11">Models/</text>
  <text x="68" y="220" fill="#94A3B8" font-family="monospace" font-size="11">routes/</text>
  <text x="68" y="245" fill="#94A3B8" font-family="monospace" font-size="11">database/</text>

  <!-- Code Editor Body -->
  <g font-family="'JetBrains Mono', monospace" font-size="11">
    <!-- Line numbers -->
    <text x="190" y="108" fill="#475569">01</text>
    <text x="190" y="130" fill="#475569">02</text>
    <text x="190" y="152" fill="#475569">03</text>
    <text x="190" y="174" fill="#475569">04</text>
    <text x="190" y="196" fill="#475569">05</text>
    <text x="190" y="218" fill="#475569">06</text>
    <text x="190" y="240" fill="#475569">07</text>
    <text x="190" y="262" fill="#475569">08</text>

    <!-- Code tokens -->
    <text x="220" y="108" fill="#F43F5E">class </text>
    <text x="260" y="108" fill="#38BDF8">EngineController </text>
    <text x="390" y="108" fill="#F43F5E">extends </text>
    <text x="445" y="108" fill="#FBBF24">Controller</text>

    <text x="220" y="130" fill="#E2E8F0">{</text>
    
    <text x="235" y="152" fill="#F43F5E">public function </text>
    <text x="350" y="152" fill="#34D399">deployService</text>
    <text x="450" y="152" fill="#E2E8F0">(Request $req)</text>

    <text x="235" y="174" fill="#E2E8F0">{</text>
    
    <text x="250" y="196" fill="#94A3B8">$arch = </text>
    <text x="305" y="196" fill="#FBBF24">StudioEngine</text>
    <text x="395" y="196" fill="#E2E8F0">::build([</text>

    <text x="265" y="218" fill="#A78BFA">'framework' </text>
    <text x="350" y="218" fill="#E2E8F0">=&gt; </text>
    <text x="375" y="218" fill="#34D399">'Laravel 12 + React'</text>

    <text x="265" y="240" fill="#A78BFA">'security'  </text>
    <text x="350" y="240" fill="#E2E8F0">=&gt; </text>
    <text x="375" y="240" fill="#34D399">'CSRF &amp; XSS Protected'</text>

    <text x="250" y="262" fill="#E2E8F0">]);</text>
  </g>

  <!-- Floating Terminal Card on bottom right -->
  <g transform="translate(320, 245)">
    <rect width="215" height="75" rx="10" fill="#080F20" stroke="#155DFC" stroke-width="1.5"/>
    <text x="14" y="25" fill="#38BDF8" font-family="monospace" font-size="10">~ studio-cli --build</text>
    <text x="14" y="44" fill="#10B981" font-family="monospace" font-size="10">✓ 3011 modules compiled</text>
    <text x="14" y="62" fill="#A855F7" font-family="monospace" font-size="10">⚡ High Performance Engine</text>
  </g>
</svg>
