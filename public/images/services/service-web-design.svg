<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wdScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="wdAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#155DFC"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="wdShadow" x="-20" y="-10" width="640" height="410" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#080F20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#wdBg)"/>
  
  <!-- Ambient Glow -->
  <circle cx="500" cy="80" r="180" fill="#155DFC" fill-opacity="0.2" filter="blur(60px)"/>
  <circle cx="100" cy="300" r="160" fill="#6D28D9" fill-opacity="0.15" filter="blur(50px)"/>

  <!-- Realistic Laptop Base & Body (Front Angle) -->
  <!-- Screen Lid -->
  <rect x="70" y="35" width="460" height="270" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <!-- Bezel -->
  <rect x="76" y="41" width="448" height="258" rx="10" fill="#080F20"/>
  <!-- Web Camera Notch -->
  <circle cx="300" cy="48" r="3" fill="#334155"/>
  <circle cx="300" cy="48" r="1" fill="#10B981"/>

  <!-- Screen Content (Modern Responsive Website Showcase) -->
  <g clip-path="url(#wdClip)">
    <clipPath id="wdClip">
      <rect x="84" y="55" width="432" height="236" rx="6"/>
    </clipPath>
    <rect x="84" y="55" width="432" height="236" fill="url(#wdScreen)"/>

    <!-- Website Navbar -->
    <rect x="84" y="55" width="432" height="32" fill="#FFFFFF"/>
    <line x1="84" y1="87" x2="516" y2="87" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="98" y="65" width="48" height="12" rx="4" fill="#080F20"/>
    <rect x="220" y="68" width="30" height="6" rx="3" fill="#94A3B8"/>
    <rect x="260" y="68" width="30" height="6" rx="3" fill="#94A3B8"/>
    <rect x="300" y="68" width="30" height="6" rx="3" fill="#94A3B8"/>
    <rect x="440" y="63" width="62" height="16" rx="8" fill="#155DFC"/>

    <!-- Website Hero -->
    <rect x="98" y="105" width="180" height="16" rx="4" fill="#080F20"/>
    <rect x="98" y="127" width="140" height="12" rx="3" fill="url(#wdAccent)"/>
    <rect x="98" y="148" width="190" height="7" rx="3" fill="#64748B"/>
    <rect x="98" y="160" width="160" height="7" rx="3" fill="#64748B"/>
    
    <rect x="98" y="180" width="75" height="22" rx="6" fill="#155DFC"/>
    <rect x="180" y="180" width="65" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>

    <!-- Website Hero Media Mockup -->
    <rect x="310" y="102" width="192" height="110" rx="10" fill="#080F20"/>
    <rect x="320" y="112" width="172" height="38" rx="6" fill="#1E293B"/>
    <circle cx="335" cy="131" r="8" fill="#155DFC"/>
    <rect x="350" y="126" width="60" height="5" rx="2" fill="#E2E8F0"/>
    <rect x="350" y="134" width="40" height="4" rx="2" fill="#64748B"/>

    <rect x="320" y="156" width="82" height="46" rx="6" fill="#1E293B"/>
    <rect x="410" y="156" width="82" height="46" rx="6" fill="#1E293B"/>

    <!-- Bottom Feature Cards Row -->
    <rect x="98" y="218" width="94" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="202" y="218" width="94" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="306" y="218" width="94" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="410" y="218" width="92" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>

  <!-- Laptop Base Keyboard & Hinge -->
  <path d="M 30 305 L 570 305 L 540 324 L 60 324 Z" fill="#94A3B8"/>
  <path d="M 60 324 L 540 324 L 525 330 L 75 330 Z" fill="#64748B"/>
  <!-- Trackpad Notch -->
  <rect x="260" y="306" width="80" height="4" rx="2" fill="#475569"/>

  <!-- Floating Glass Tag -->
  <g transform="translate(420, 290)">
    <rect width="140" height="40" rx="10" fill="#080F20" fill-opacity="0.85" stroke="#155DFC" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="5" fill="#10B981"/>
    <text x="32" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">Responsive UI</text>
  </g>
</svg>
