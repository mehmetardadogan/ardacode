<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p3Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#p3Bg)"/>
  <circle cx="680" cy="150" r="240" fill="#155DFC" fill-opacity="0.2" filter="blur(80px)"/>
  <circle cx="120" cy="380" r="220" fill="#F59E0B" fill-opacity="0.15" filter="blur(70px)"/>

  <!-- Laptop Display -->
  <rect x="80" y="40" width="640" height="390" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
  <rect x="88" y="48" width="624" height="374" rx="14" fill="#080F20"/>
  <circle cx="400" cy="54" r="2.5" fill="#10B981"/>

  <!-- Screen Content -->
  <g clip-path="url(#p3Clip)">
    <clipPath id="p3Clip">
      <rect x="96" y="66" width="608" height="346" rx="8"/>
    </clipPath>
    <rect x="96" y="66" width="608" height="346" fill="#FFFFFF"/>

    <!-- Navbar -->
    <rect x="96" y="66" width="608" height="42" fill="#F8FAFC"/>
    <line x1="96" y1="108" x2="704" y2="108" stroke="#E2E8F0"/>
