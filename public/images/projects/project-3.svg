    <!-- Banner -->
    <rect x="120" y="125" width="560" height="85" rx="12" fill="#080F20"/>
    <text x="145" y="160" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900">İSKANDİNAV MİNİMALİZMİ</text>
    <text x="145" y="182" fill="#60A5FA" font-family="sans-serif" font-size="11">Dönüşüm Odaklı E-Ticaret Arayüzü &amp; Ultra Hızlı Ödeme</text>

    <!-- Product Grid inside mockup -->
    <rect x="120" y="225" width="170" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="135" y="235" width="140" height="95" rx="6" fill="#E2E8F0"/>
    <rect x="135" y="340" width="90" height="9" rx="3" fill="#080F20"/>
    <rect x="135" y="355" width="60" height="9" rx="3" fill="#155DFC"/>

    <rect x="315" y="225" width="170" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="330" y="235" width="140" height="95" rx="6" fill="#E2E8F0"/>
    <rect x="330" y="340" width="100" height="9" rx="3" fill="#080F20"/>
    <rect x="330" y="355" width="60" height="9" rx="3" fill="#155DFC"/>

    <rect x="510" y="225" width="170" height="175" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="525" y="235" width="140" height="95" rx="6" fill="#E2E8F0"/>
    <rect x="525" y="340" width="85" height="9" rx="3" fill="#080F20"/>
