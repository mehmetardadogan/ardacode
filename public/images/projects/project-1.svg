<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p1Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080F20"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="p1Blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#155DFC"/>
      <stop offset="100%" stop-color="#155DFC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#p1Bg)"/>
  <circle cx="650" cy="120" r="260" fill="#155DFC" fill-opacity="0.25" filter="blur(80px)"/>
  <circle cx="150" cy="400" r="220" fill="#6D28D9" fill-opacity="0.18" filter="blur(70px)"/>

  <!-- Realistic Aluminum Laptop Display -->
  <!-- Screen Outer Lid -->
  <rect x="80" y="40" width="640" height="390" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
  <!-- Bezel -->
  <rect x="88" y="48" width="624" height="374" rx="14" fill="#080F20"/>
  <!-- Camera Notch -->
  <rect x="360" y="48" width="80" height="12" rx="6" fill="#080F20"/>
  <circle cx="400" cy="54" r="3" fill="#334155"/>
  <circle cx="400" cy="54" r="1" fill="#10B981"/>

  <!-- Screen Content -->
  <g clip-path="url(#p1ScreenClip)">
    <clipPath id="p1ScreenClip">
      <rect x="96" y="66" width="608" height="346" rx="8"/>
    </clipPath>
    <rect x="96" y="66" width="608" height="346" fill="#0A0F1D"/>

    <!-- App Topbar -->
    <rect x="96" y="66" width="608" height="38" fill="#0F172A"/>
    <line x1="96" y1="104" x2="704" y2="104" stroke="#1E293B"/>
    <rect x="115" y="78" width="80" height="14" rx="4" fill="#155DFC"/>
    <text x="125" y="89" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800">NOVA CLOUD</text>

    <rect x="280" y="76" width="240" height="18" rx="6" fill="#1E293B"/>
    <text x="330" y="89" fill="#94A3B8" font-family="monospace" font-size="9">https://app.novasaas.io/metrics</text>

    <!-- Sidebar -->
    <rect x="96" y="104" width="130" height="308" fill="#080F20"/>
    <line x1="226" y1="104" x2="226" y2="412" stroke="#1E293B"/>
    <rect x="110" y="125" width="100" height="20" rx="6" fill="#155DFC" fill-opacity="0.2"/>
    <text x="130" y="139" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">● Canlı Metrik</text>
    <rect x="110" y="155" width="90" height="12" rx="3" fill="#334155"/>
    <rect x="110" y="177" width="80" height="12" rx="3" fill="#334155"/>
    <rect x="110" y="199" width="85" height="12" rx="3" fill="#334155"/>

    <!-- 3 Metrics Top -->
    <rect x="245" y="120" width="140" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="260" y="142" fill="#94A3B8" font-family="sans-serif" font-size="10">Toplam Kullanıcı</text>
    <text x="260" y="172" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900">148,920</text>
    <text x="345" y="172" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">+24.5%</text>

    <rect x="400" y="120" width="140" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="415" y="142" fill="#94A3B8" font-family="sans-serif" font-size="10">Dönüşüm Oranı</text>
    <text x="415" y="172" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900">5.82%</text>
    <text x="500" y="172" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">+6.1%</text>

    <rect x="555" y="120" width="135" height="75" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="570" y="142" fill="#94A3B8" font-family="sans-serif" font-size="10">API Tepki Süresi</text>
    <text x="570" y="172" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900">38ms</text>
    <text x="640" y="172" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="700">Ultra</text>

    <!-- Main Chart -->
    <rect x="245" y="210" width="445" height="185" rx="10" fill="#0F172A" stroke="#1E293B"/>
    <path d="M 265 360 Q 340 280 420 310 T 560 250 T 670 230" fill="none" stroke="#155DFC" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 265 360 Q 340 280 420 310 T 560 250 T 670 230 L 670 380 L 265 380 Z" fill="url(#p1Blue)" opacity="0.3"/>
  </g>

  <!-- Laptop Base Hinge / Lower Body -->
  <path d="M 40 430 L 760 430 L 710 455 L 90 455 Z" fill="#64748B"/>
  <rect x="350" y="432" width="100" height="5" rx="2.5" fill="#334155"/>
</svg>
